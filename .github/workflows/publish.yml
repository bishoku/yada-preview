name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Trusted Publishing (OIDC) & Provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm to v11 (Required for OIDC Trusted Publishing)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests & Coverage
        run: npm run test

      - name: Build Package
        run: npm run build

      - name: Publish to NPM Registry (via OIDC Trusted Publisher)
        run: npm publish --provenance --access public
